stages:
  download:
    cmd: python -m sentiment.prepare download
    deps:
      - src/sentiment/prepare.py
      - src/sentiment/data.py
    outs:
      - data/raw

  prepare:
    cmd: python -m sentiment.prepare prepare
    deps:
      - data/raw
      - src/sentiment/prepare.py
      - src/sentiment/data.py
    outs:
      - data/processed

  export_feedback:
    cmd: python -m sentiment.retrain export
    deps:
      - src/sentiment/retrain.py
    outs:
      - data/feedback/reviewed.parquet:
          cache: false

  train:
    cmd: python -m sentiment.train
    deps:
      - data/processed
      - data/feedback/reviewed.parquet
      - src/sentiment/train.py
    params:
      - train
    outs:
      - models/model.joblib
      - models/run_info.json:
          cache: false

  evaluate:
    cmd: python -m sentiment.evaluate
    deps:
      - data/processed/test.parquet
      - models/model.joblib
      - models/run_info.json
      - src/sentiment/evaluate.py
      - src/sentiment/gates.py
    params:
      - gates
    metrics:
      - reports/metrics.json:
          cache: false
    outs:
      - reports/gates.json:
          cache: false

  register:
    cmd: python -m sentiment.registry register
    deps:
      - reports/gates.json
      - models/run_info.json
      - src/sentiment/registry.py
