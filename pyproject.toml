[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-mlops"
version = "0.1.0"
description = "IMDB sentiment classifier with an MLOps lifecycle"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "datasets>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# Installed in the Control Center image (registry access + drift reports).
control = ["mlflow>=3.0", "evidently>=0.7"]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]
mlops = ["mlflow>=3.0", "dvc>=3.50", "evidently>=0.7"]

[tool.uv]
default-groups = ["dev", "mlops"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
