train:
  ngram_max: 2
  min_df: 3
  max_features: 200000
  C: 2.0

gates:
  min_accuracy: 0.88
  min_macro_f1: 0.88
  min_class_recall: 0.85      # worst per-class recall
  max_regression: 0.01        # allowed macro-F1 drop vs current champion

registry:
  model_name: sentiment-classifier

monitoring:
  window: 1000                # most recent predictions compared to the reference
  min_samples: 30             # below this, report "insufficient_data"
  reference_size: 2000        # held-out test rows scored by the serving model
  drift_share_threshold: 0.4  # share of drifted columns that counts as dataset drift
