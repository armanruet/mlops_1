name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --python 3.12
      - name: Lint
        run: uv run ruff check src tests
      - name: Unit tests (API, gates, cleaning)
        run: uv run pytest -q
      - name: Validate DVC pipeline definition
        run: uv run dvc dag

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f Dockerfile.api -t sentiment-api:ci .
      - name: Build web image
        run: docker build -t sentiment-web:ci web
      - name: Build Control Center image
        run: docker build -f Dockerfile.control -t sentiment-control:ci .
      - name: Build MLflow server image
        run: docker build -f Dockerfile.mlflow -t sentiment-mlflow:ci .
      - name: Validate compose file
        run: docker compose config --quiet
