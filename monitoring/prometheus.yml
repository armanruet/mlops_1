global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
  - job_name: control
    static_configs:
      - targets: ["control:8000"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
