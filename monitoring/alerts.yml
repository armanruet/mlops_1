groups:
  - name: sentiment-service
    rules:
      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Inference API is down"}

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{job="api",status=~"5.."}[5m]))
            / sum(rate(http_requests_total{job="api"}[5m])) > 0.05
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "More than 5% of API requests are failing"}

      - alert: HighPredictLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{path="/predict"}[5m]))) > 1
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "p95 /predict latency above 1s"}

      - alert: LowMeanConfidence
        expr: |
          sum(rate(prediction_confidence_sum[15m])) / sum(rate(prediction_confidence_count[15m])) < 0.7
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "Mean prediction confidence below 0.7 (possible drift)"}

  - name: ml-drift
    rules:
      - alert: DataDriftDetected
        expr: drift_detected == 1
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "Evidently detected dataset drift; consider retraining"}
